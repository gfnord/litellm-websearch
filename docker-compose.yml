services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./strip_non_text_content.py:/app/strip_non_text_content.py:ro
    env_file:
      - .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
    command: ["litellm", "--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - litellm-network
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health -H \"Authorization: Bearer $$LITELLM_MASTER_KEY\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  websearch-proxy:
    build:
      context: .
      dockerfile: Dockerfile.websearch
    container_name: websearch-proxy
    ports:
      - "4001:4001"
    environment:
      - LITELLM_URL=http://litellm:4000
      - SERPER_API_KEY=${SERPER_API_KEY}
    restart: unless-stopped
    networks:
      - litellm-network
    depends_on:
      - litellm

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: litellm-caddy
    restart: unless-stopped
    ports:
      - "4443:4443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - litellm-network
    depends_on:
      - litellm

networks:
  litellm-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
