      max_parallel_requests: 10  # Exact match to your dashboard
      rpm: 120                   # Added as a safety buffer (10 concurrent * ~12 per min)
    model_info:
      input_cost_per_token: 0.00000098   # $0.98 per 1M tokens
      output_cost_per_token: 0.00000308  # $3.08 per 1M tokens

  - model_name: glm-4.7
