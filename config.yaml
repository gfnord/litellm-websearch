model_list:
  - model_name: glm-4.7-zai
    litellm_params:
      model: anthropic/glm-4.7
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/anthropic
    model_info:
      # Z.AI concurrency limit: 2. Cap at 1 to leave headroom for Fair Use.
      max_parallel_requests: 1

  - model_name: claude-opus-4-5-20251101
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
    model_info:
      supports_web_search: true

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
    model_info:
      supports_web_search: true

  - model_name: claude-opus-4-6
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
    model_info:
      supports_web_search: true

  - model_name: qwen-3
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
    model_info:
      supports_web_search: true

  - model_name: dolphin3
    litellm_params:
      model: ollama_chat/dolphin3:8b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
      extra_body:
        think: false
    model_info:
      supports_web_search: true
      supports_function_calling: false
      supports_parallel_function_calling: false

  - model_name: qwen-3.5
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://host.docker.internal:11434
      max_tokens: 32768
    model_info:
      supports_web_search: true

  - model_name: glm-5.1
    litellm_params:
      model: anthropic/glm-5.1
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/anthropic
    model_info:
      input_cost_per_token: 0.00000098   # $0.98 per 1M tokens
      output_cost_per_token: 0.00000308  # $3.08 per 1M tokens
      # Z.AI concurrency limit: 10. Cap at 6 for Fair Use headroom.
      max_parallel_requests: 4
      supports_web_search: false

  - model_name: glm-5.2-1m
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/paas/v4
    model_info:
      max_tokens: 1000000
      input_cost_per_token: 0.00000098   # $0.98 per 1M tokens
      output_cost_per_token: 0.00000308  # $3.08 per 1M tokens
      max_parallel_requests: 4
      supports_web_search: false
      supports_reasoning: true

  - model_name: glm-4.7
    litellm_params:
      model: anthropic/glm-4.7
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/anthropic
    model_info:
      # Z.AI concurrency limit: 2. Cap at 1.
      max_parallel_requests: 1

  - model_name: glm-5-turbo
    litellm_params:
      model: anthropic/glm-5-turbo
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/anthropic
    model_info:
      # Z.AI concurrency limit: 1. Match exactly.
      max_parallel_requests: 1

  - model_name: glm-4.5-air
    litellm_params:
      model: anthropic/glm-4.5-air
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/anthropic
    model_info:
      # Z.AI concurrency limit: 5. Cap at 3 for Fair Use headroom.
      max_parallel_requests: 3

litellm_settings:
  master_key: sk-123345sdf
  num_retries: 3
  request_timeout: 300
  retry_on_rate_limit: true
  drop_params: true
  set_verbose: true
  json_logs: true
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    namespace: "litellm.caching.caching"
  web_search_provider: serper
  callbacks: ["websearch_interception"]
  websearch_interception_params:
    enabled_providers: ["ollama_chat"]

router_settings:
  routing_strategy: simple-shuffle
  cooldown_time: 60           # reduced from 120 — less time benched per model
  num_retries: 2
  retry_after: 10
  allowed_fails: 3            # increased from 1 — don't bench on a single transient error
  fallbacks:
    # ZAI models fall back through each other, then to local Ollama as last resort
    - glm-5.1:
        - glm-4.5-air
        - glm-4.7
        - qwen-3        # local Ollama safety net — always available
    - glm-4.7:
        - glm-4.5-air
        - glm-5.1
        - qwen-3
    - glm-4.7-zai:
        - glm-4.5-air
        - glm-5.1
        - qwen-3
    - glm-4.5-air:
        - glm-4.7
        - glm-5.1
        - qwen-3
    - glm-5-turbo:
        - glm-5.1
        - glm-4.5-air
        - qwen-3

general_settings:
  max_parallel_requests: 10   # global proxy-wide concurrency cap
