      max_parallel_requests: 5   # Exact match to your dashboard
      rpm: 60                    # Safety buffer

litellm_settings:
  master_key: sk-123345sdf
  num_retries: 3
  request_timeout: 60
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    namespace: "litellm.caching.caching"
  web_search_provider: serper
  callbacks: ["websearch_interception"]
  websearch_interception_params:
    enabled_providers: ["ollama_chat"]

router_settings:
  routing_strategy: simple-shuffle
